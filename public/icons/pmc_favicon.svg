<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    /* Default: Light Mode browser tab (white/light gray chrome) */
    .pmc-bezel { fill: #101820; }
    .pmc-screen { fill: #0B1117; }
    .pmc-bars { fill: #0FA958; }

    /* Dark Mode browser tab (dark/black chrome) */
    @media (prefers-color-scheme: dark) {
      .pmc-bezel { fill: #E6EDF3; }
      .pmc-screen { fill: #0B1117; }
      .pmc-bars { fill: #3DDC84; }
    }
  </style>

  <!-- Stand & Base -->
  <path class="pmc-bezel" d="M28 42h8v8h-8z M18 50h28v4a2 2 0 0 1-2 2H20a2 2 0 0 1-2-2v-4z"/>

  <!-- Monitor Outer Bezel -->
  <rect class="pmc-bezel" x="5" y="6" width="54" height="37" rx="5"/>

  <!-- Display Screen -->
  <rect class="pmc-screen" x="9" y="10" width="46" height="29" rx="2.5"/>

  <!-- Green Telemetry Bars -->
  <g class="pmc-bars">
    <rect x="15" y="24" width="4" height="9" rx="1"/>
    <rect x="22" y="18" width="4" height="15" rx="1"/>
    <rect x="29" y="22" width="4" height="11" rx="1"/>
    <rect x="36" y="15" width="4" height="18" rx="1"/>
    <rect x="43" y="20" width="4" height="13" rx="1"/>
  </g>
</svg>
